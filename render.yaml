services:
  - type: web
    name: rujuk
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: CONTACT_EMAIL
        sync: false
      - key: PUBLIC_URL
        value: https://rujuk.id
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LYNK_WEBHOOK_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Rujuk <noreply@rujuk.id>
      - key: ADMIN_WA
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
