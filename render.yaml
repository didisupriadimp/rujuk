services:
  - type: web
    name: rujuk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: CONTACT_EMAIL
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
